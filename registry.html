<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Registry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #fafafa;
            padding: 2vw;
            min-height: 100vh;
        }

        .registry-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-grid-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-column-gap: 1.55vw;
            grid-row-gap: 1.55vw;
            width: 100%;
        }

        .gallery-grid-item {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: visible;
        }

        .gallery-grid-item-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-grid-image-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-grid-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .gallery-caption {
            padding: 1.2vw 0.8vw;
            background: #fff;
            border-radius: 0 0 8px 8px;
            flex-shrink: 0;
            min-height: 3.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #f0f0f0;
        }

        .gallery-caption-content {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.5;
            text-align: center;
            margin: 0;
            width: 100%;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="registry-container">
        <h1 style="text-align: center; margin-bottom: 2rem; color: #333;">Wedding Registry</h1>
        <div class="gallery-grid-wrapper" id="galleryGrid"></div>
    </div>

    <script src="registry.js"></script>
</body>
</html>
